version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm ci --no-audit --prefer-offline
    build:
      commands:
        - 'echo "VITE_NEU_API_BASE=${VITE_NEU_API_BASE}" > .env.production'
        - 'echo "VITE_NEU_APP_NAME=${VITE_NEU_APP_NAME:-NEU Cashier Dashboard}" >> .env.production'
        - 'echo "VITE_NEU_ENV_LABEL=${VITE_NEU_ENV_LABEL:-Production}" >> .env.production'
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'X-Frame-Options'
        value: 'DENY'
  - pattern: '/assets/**/*.@(js|css|woff|woff2|jpg|png|svg)'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, no-store, must-revalidate'
